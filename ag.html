let I = null;   // estado del importador

function parseCSV(txt){
  txt = String(txt).replace(/^\uFEFF/, '');
  const first = txt.split(/\r?\n/, 1)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a,b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if(q){
      if(ch === '"'){ if(txt[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch;
    }else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && txt[i+1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function numImp(v){
  let s = String(v ?? '').replace(/[Qq$\s]/g, ''); if(!s) return 0;
  if(s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
  else if(/,\d{1,2}$/.test(s)) s = s.replace(',', '.');
  else s = s.replace(/,/g, '');
  const n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function parseFecha(v){
  const s = String(v ?? '').trim(); if(!s) return null; let m;
  if((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))) return okF(+m[1], +m[2], +m[3]);
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) return okF(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);   // día/mes/año (formato Guatemala)
  if(/^\d{5}$/.test(s)){ const d = new Date(Date.UTC(1899, 11, 30) + (+s) * 864e5); return okF(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }   // fecha serial de Excel
  return null;
}
function okF(y, m, d){ if(m < 1 || m > 12 || d < 1 || d > 31 || y < 2000 || y > 2100) return null; return `${y}-${p2d(m)}-${p2d(d)}`; }
function parseDia(v){
  const s = norm(v); if(!s) return null; if(/^[1-7]$/.test(s)) return +s;
  const i = ['lun','mar','mie','jue','vie','sab','dom'].indexOf(s.slice(0, 3)); return i >= 0 ? i + 1 : null;
}
// Convierte texto libre de frecuencia (archivos viejos) a uno de los 5 valores fijos; si no se reconoce, queda sin frecuencia
// para que el supervisor la asigne a mano, en vez de guardar un texto que ya no se puede usar para calcular cumplimiento.
function normFrecuencia(v){
  const s = norm(v); if(!s) return null;
  if(s.includes('diari')) return 'diario';
  if(s.includes('varios')) return 'varios_dias_semana';
  if(s.includes('quince') || s.includes('15')) return 'quincenal';
  if(s.includes('mensual') || s.includes('mes')) return 'mensual';
  if(s.includes('semanal') || s.includes('semana')) return 'semanal';
  return null;
}
const parseForma = v => { const s = norm(v); return s.startsWith('cred') ? 'credito' : (s.startsWith('tran') || s.startsWith('dep') || s.includes('banco')) ? 'transferencia' : 'efectivo'; };
const parseTipoV = v => { const s = norm(v); return s.startsWith('tie') || s.startsWith('mos') ? 'tienda' : s ? 'domicilio' : ''; };

VISTAS.importar = async () => {
  I = {tipo:'clientes', head:[], filas:[], map:{}, eq:{}, crearCli:'no', credPagado:true};
  $('#vista').innerHTML = `
    <div class="card"><h2>📥 Importar datos históricos</h2>
      <p class="peq">Sube o pega tus hojas de Excel/Google Sheets guardadas como <b>CSV</b>. Después confirmas qué columna es cada dato.</p>
      <label>¿Qué vas a importar?</label>
      <select id="im-t" onchange="I.tipo=this.value;$('#im-plantilla').textContent='Descargar plantilla de '+IMP[I.tipo].titulo.split(' (')[0].toLowerCase()">
        ${Object.entries(IMP).map(([k, v]) => `<option value="${k}">${v.titulo}</option>`).join('')}</select>
      <label>Archivo CSV</label><input type="file" id="im-file" accept=".csv,.txt,text/csv" onchange="imLeerArchivo(this)">
      <label>…o pega el contenido aquí</label><textarea id="im-txt" placeholder="Pega aquí las filas copiadas de tu hoja (con la fila de títulos)"></textarea>
      <div class="fila-btn"><button class="btn" onclick="imProcesar()">Leer datos</button>
        <button class="btn sec" id="im-plantilla" onclick="imPlantilla()">Descargar plantilla de clientes</button></div>
      <p class="aviso">⚠ No importes dos veces el mismo archivo de ventas: se duplicarían. Los clientes sí se pueden reimportar (se actualizan por dirección corta).</p></div>
    <div id="im-paso2"></div>`;
};
function imLeerArchivo(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let t; try{ t = new TextDecoder('utf-8', {fatal:true}).decode(rd.result); }catch(e){ t = new TextDecoder('windows-1252').decode(rd.result); }
    $('#im-txt').value = t; imProcesar();
  };
  rd.readAsArrayBuffer(f);
}
function imPlantilla(){
  const ej = {
    clientes:{direccion_corta:'10 calle A 12-25', nombre:'Doña Marta López', telefono:'55551234', zona:'Zona 1', ruta:'Ruta Norte', dia_semana:'Lunes', frecuencia:'semanal', garrafones_prestados:2, ubicacion:'14.6349, -90.5069', notas:''},
    ventas:{fecha:'15/03/2025', cliente:'10 calle A 12-25', producto:'Garrafón agua', cantidad:2, precio:10, forma_pago:'efectivo', tipo:'domicilio'},
    gastos:{fecha:'15/03/2025', categoria:'Gasolina', monto:50, descripcion:'Gasolina moto'}}[I.tipo];
  descargarCSV('plantilla_' + I.tipo, [ej]);
}
function imProcesar(){
  const t = $('#im-txt').value.trim(); if(!t) return toast('Sube un archivo o pega los datos', 'warn');
  const rows = parseCSV(t); if(rows.length < 2) return toast('No encontré filas de datos (necesito títulos + al menos 1 fila)', 'warn');
  I.tipo = $('#im-t').value; I.head = rows[0].map(h => String(h).trim()); I.filas = rows.slice(1); I.eq = {};
  // Adivina la columna de cada campo: primero coincidencias exactas, luego parciales
  I.map = {}; const usados = new Set(), H = I.head.map(h => norm(h).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim());
  const campos = IMP[I.tipo].campos;
  campos.forEach(c => { const i = H.findIndex((h, ix) => !usados.has(ix) && c.sin.includes(h)); if(i >= 0){ I.map[c.k] = i; usados.add(i); } });
  campos.forEach(c => { if(I.map[c.k] != null) return; const i = H.findIndex((h, ix) => !usados.has(ix) && h && c.sin.some(s => s.length >= 4 && h.includes(s))); if(i >= 0){ I.map[c.k] = i; usados.add(i); } });
  imPaso2();
}
function imSetMap(k, v){ I.map[k] = v === '' ? null : +v; imPaso2(); }
function imCol(f, k){ const i = I.map[k]; return i == null ? '' : String(f[i] ?? '').trim(); }

// Convierte las filas del CSV en objetos listos para la base de datos
function imPrepClientes(){
  const out = new Map(), err = [];
  I.filas.forEach((f, n) => {
    const dir = imCol(f, 'direccion_corta'); let nom = imCol(f, 'nombre');
    if(!dir){ err.push(`Fila ${n+2}: sin dirección corta`); return; }
    const o = {direccion_corta:dir, nombre:nom || dir};
    const set = (k, v) => { if(I.map[k] != null) o[k] = v; };
    set('telefono', imCol(f,'telefono') || null); set('direccion_completa', imCol(f,'direccion_completa') || null); set('zona', imCol(f,'zona') || null);
    set('notas', imCol(f,'notas') || null);
    if(I.map.frecuencia != null) o.frecuencia = normFrecuencia(imCol(f,'frecuencia'));
    if(I.map.estado != null) o.estado = imCol(f,'estado') || 'activo';
    if(I.map.dia_semana != null){ const d = parseDia(imCol(f,'dia_semana')); o.dia_semana = d; o.dias_semana = d ? [d] : []; }
    if(I.map.ruta != null){ const rn = norm(imCol(f,'ruta')); const r = S.rutas.find(x => norm(x.nombre) === rn); o.ruta_id = r ? r.id : null; }
    if(I.map.garrafones_prestados != null) o.garrafones_prestados = Math.max(0, Math.round(numImp(imCol(f,'garrafones_prestados'))));
    if(I.map.ultima_compra != null) o.ultima_compra = parseFecha(imCol(f,'ultima_compra'));
    if(I.map.dias_ultima_compra != null) o.dias_ultima_compra = Math.round(numImp(imCol(f,'dias_ultima_compra')));
    if(I.map.compras_historicas != null) o.compras_historicas = Math.round(numImp(imCol(f,'compras_historicas')));
    if(I.map.total_q_historico != null) o.total_q_historico = r2(numImp(imCol(f,'total_q_historico')));
    if(I.map.promedio_q != null) o.promedio_q = r2(numImp(imCol(f,'promedio_q')));
    if(I.map.ubicacion != null){ const u = parseUbicacion(imCol(f,'ubicacion')); o.lat = u ? u.lat : null; o.lng = u ? u.lng : null; o.maps_link = u ? u.link : null; }
    out.set(dir, o);        // si la dirección se repite en el archivo, gana la última
  });
  return {filas:[...out.values()], err};
}
function matchProdImp(s){
  const n = norm(s); if(!n) return null; const P = S.productos.filter(p => p.activo);
  let m = P.find(p => norm(p.nombre) === n); if(m) return m.id;
  if(n.includes('hielo')){ const d = n.match(/(\d+)/); if(d){ m = P.find(p => norm(p.nombre) === 'hielo q' + d[1]); if(m) return m.id; } }
  if(/recarga/.test(n)){ m = P.find(p => norm(p.nombre).includes('recarga')); if(m) return m.id; }
  if(/garraf|tambo/.test(n)){ m = P.find(p => norm(p.nombre).startsWith('garrafon')); if(m) return m.id; }
  m = P.find(p => norm(p.nombre).includes(n) || n.includes(norm(p.nombre))); return m ? m.id : null;
}
function imPrepVentas(){
  const err = [], ventas = new Map(), det = [], nuevos = new Map(); let ign = 0;
  const porDir = {}, porNom = {}; S.clientes.forEach(c => { porDir[norm(c.direccion_corta)] = c; porNom[norm(c.nombre)] = c; });
  const distintos = [...new Set(I.filas.map(f => imCol(f, 'producto')).filter(Boolean))];
  distintos.forEach(p => { if(!(p in I.eq)) I.eq[p] = matchProdImp(p) || ''; });
  I.filas.forEach((f, n) => {
    const fecha = parseFecha(imCol(f,'fecha')), ptxt = imCol(f,'producto'), cant = numImp(imCol(f,'cantidad'));
    if(!fecha){ err.push(`Fila ${n+2}: fecha no válida (“${imCol(f,'fecha')}”)`); return; }
    if(!ptxt || cant <= 0){ err.push(`Fila ${n+2}: falta producto o cantidad`); return; }
    const pid = I.eq[ptxt]; if(!pid){ ign++; return; }
    const ctxt = imCol(f,'cliente'); let cid = null;
    if(ctxt){
      const c = porDir[norm(ctxt)] || porNom[norm(ctxt)];
      if(c) cid = c.id;
      else if(I.crearCli === 'si'){ const k = norm(ctxt); if(!nuevos.has(k)) nuevos.set(k, {id:uuid(), nombre:ctxt, direccion_corta:ctxt}); cid = nuevos.get(k).id; }
    }
    let tipo = parseTipoV(imCol(f,'tipo')) || (cid ? 'domicilio' : 'tienda');
    let forma = I.map.forma_pago != null ? parseForma(imCol(f,'forma_pago')) : 'efectivo';
    if(forma === 'credito' && !cid) forma = 'efectivo';
    let pu = numImp(imCol(f,'precio')), st;
    if(I.map.precio != null && pu > 0) st = r2(cant * pu);
    else if(I.map.subtotal != null && numImp(imCol(f,'subtotal')) > 0){ st = r2(numImp(imCol(f,'subtotal'))); pu = r2(st / cant); }
    else { pu = precioDe(pid, cid, tipo); st = r2(cant * pu); }
    const key = [fecha, cid || '', tipo, forma, imCol(f,'pedido')].join('|');
    let v = ventas.get(key);
    if(!v){ v = {id:uuid(), fecha, usuario_id:S.user.id, cliente_id:cid, tipo, forma_pago:forma, estado_credito: forma === 'credito' ? (I.credPagado ? 'pagada' : 'pendiente') : 'na', total_q:0, notas:'Importado', importada:true}; ventas.set(key, v); }
    v.total_q = r2(v.total_q + st);
    det.push({id:uuid(), venta_id:v.id, producto_id:pid, cantidad:cant, precio_unitario:pu, subtotal_q:st});
  });
  return {ventas:[...ventas.values()], det, err, ign, nuevos:[...nuevos.values()], distintos};
}
function imPrepGastos(){
  const err = [], filas = []; const otros = S.cats.find(c => norm(c.nombre) === 'otros');
  I.filas.forEach((f, n) => {
    const fecha = parseFecha(imCol(f,'fecha')), monto = numImp(imCol(f,'monto'));
    if(!fecha){ err.push(`Fila ${n+2}: fecha no válida (“${imCol(f,'fecha')}”)`); return; }
    if(monto <= 0){ err.push(`Fila ${n+2}: monto no válido`); return; }
    const ct = norm(imCol(f,'categoria'));
    const cat = S.cats.find(c => norm(c.nombre) === ct) || (ct.length >= 4 ? S.cats.find(c => norm(c.nombre).includes(ct) || ct.includes(norm(c.nombre))) : null) || otros;
    filas.push({id:uuid(), fecha, usuario_id:S.user.id, categoria_id:cat ? cat.id : null, subcategoria: cat ? null : (imCol(f,'categoria') || null), monto_q:r2(monto), descripcion: imCol(f,'descripcion') || (imCol(f,'categoria') ? 'Importado: ' + imCol(f,'categoria') : 'Importado')});
  });
  return {filas, err};
}
function imPaso2(){
  const def = IMP[I.tipo], faltan = def.campos.filter(c => c.req && I.map[c.k] == null);
  let prev = '', info = '', err = [];
  if(!faltan.length){
    if(I.tipo === 'clientes'){ const P = imPrepClientes(); err = P.err; info = `<b>${P.filas.length}</b> clientes listos (los que ya existan se actualizarán).`; prev = imTablaPrev(P.filas.slice(0, 6)); }
    else if(I.tipo === 'gastos'){ const P = imPrepGastos(); err = P.err; info = `<b>${P.filas.length}</b> gastos listos · total ${Q(P.filas.reduce((a,x) => a + x.monto_q, 0))}.`; prev = imTablaPrev(P.filas.slice(0, 6).map(x => ({fecha:x.fecha, categoria:nomCat(x.categoria_id), monto_q:x.monto_q, descripcion:x.descripcion}))); }
    else { const P = imPrepVentas(); err = P.err; I._P = P;
      info = `<b>${P.ventas.length}</b> ventas (${P.det.length} líneas) · total ${Q(P.ventas.reduce((a,x) => a + x.total_q, 0))}${P.nuevos.length ? ` · se crearán <b>${P.nuevos.length}</b> clientes nuevos` : ''}${P.ign ? ` · <span class="neg">${P.ign} líneas se ignorarán (producto sin equivalencia)</span>` : ''}.`;
      prev = imTablaPrev(P.ventas.slice(0, 6).map(v => ({fecha:v.fecha, tipo:v.tipo, cliente:(S.cmap[v.cliente_id]||{}).direccion_corta || (P.nuevos.find(n => n.id === v.cliente_id)||{}).direccion_corta || 'Mostrador', pago:v.forma_pago, total_q:v.total_q})));
    }
  }
  const eqUI = (I.tipo === 'ventas' && !faltan.length) ? `<div class="card"><h3>Equivalencia de productos</h3><p class="peq">Indica a qué producto del sistema corresponde cada nombre de tu archivo.</p>
    ${Object.keys(I.eq).map(p => `<div class="grid" style="grid-template-columns:1fr 1fr;align-items:center;margin-bottom:6px"><div><b>${esc(p)}</b></div>
      <select onchange="I.eq[this.dataset.p]=this.value;imPaso2()" data-p="${esc(p)}"><option value="">— Ignorar estas líneas —</option>${S.productos.filter(x => x.activo).map(x => `<option value="${x.id}" ${I.eq[p]===x.id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>`).join('')}
    <label>Si el cliente del archivo no existe en el sistema</label>
    <select onchange="I.crearCli=this.value;imPaso2()"><option value="no" ${I.crearCli==='no'?'selected':''}>Registrar la venta sin cliente (mostrador)</option><option value="si" ${I.crearCli==='si'?'selected':''}>Crear el cliente nuevo</option></select>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${I.credPagado?'checked':''} onchange="I.credPagado=this.checked;imPaso2()"> Los créditos del archivo ya están pagados (no aparecerán como por cobrar)</label></div>` : '';
  $('#im-paso2').innerHTML = `
    <div class="card"><h3>Confirma las columnas</h3><p class="peq">${I.filas.length} filas leídas. Elige qué columna de tu archivo corresponde a cada dato (<span class="neg">*</span> = obligatorio).</p>
      <div class="dos">${def.campos.map(c => `<div><label>${c.et} ${c.req ? '<span class="neg">*</span>' : ''}</label>
        <select onchange="imSetMap('${c.k}', this.value)"><option value="">— No importar —</option>${I.head.map((h, i) => `<option value="${i}" ${I.map[c.k]===i?'selected':''}>${esc(h || 'Columna ' + (i+1))}</option>`).join('')}</select></div>`).join('')}</div></div>
    ${eqUI}
    ${faltan.length ? `<p class="aviso">Falta asignar: <b>${faltan.map(c => c.et).join(', ')}</b></p>` : `
    <div class="card"><h3>Vista previa</h3><p>${info}</p>${prev}
      ${err.length ? `<div class="aviso"><b>${err.length} fila(s) con problemas (no se importarán):</b><br><small>${err.slice(0, 8).map(esc).join('<br>')}${err.length > 8 ? '<br>…' : ''}</small></div>` : ''}
      <div id="im-prog" class="peq"></div>
      <button class="btn grande verde" id="im-go" onclick="imImportar()">⬆ Importar ahora</button></div>`}`;
}
function imTablaPrev(filas){
  if(!filas.length) return '<p class="peq">Sin filas.</p>';
  const cols = Object.keys(filas[0]).filter(k => !['id','ruta_id'].includes(k)).slice(0, 8);
  return `<div class="tabla-wrap"><table class="tabla"><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${filas.map(f => `<tr>${cols.map(c => `<td>${esc(f[c] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const trozos = (a, n) => { const r = []; for(let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; };
async function imImportar(){
  if(!navigator.onLine) return toast('Necesitas internet para importar', 'warn');
  if(!confirm('¿Importar estos datos ahora?')) return;
  const btn = $('#im-go'), prog = t => $('#im-prog').textContent = t; btn.disabled = true;
  try{
    if(I.tipo === 'clientes'){
      const P = imPrepClientes(); let n = 0;
      for(const ch of trozos(P.filas, 200)){
        // Todas las filas del bloque deben tener las mismas columnas (así se construyen)
        const {error} = await sb.from('clientes').upsert(ch, {onConflict:'direccion_corta'}); if(error) throw error;
        n += ch.length; prog(`Importando clientes… ${n}/${P.filas.length}`);
      }
      toast(`${n} clientes importados ✔`);
    }else if(I.tipo === 'gastos'){
      const P = imPrepGastos(); let n = 0;
      for(const ch of trozos(P.filas, 300)){ const {error} = await sb.from('egresos').insert(ch); if(error) throw error; n += ch.length; prog(`Importando gastos… ${n}/${P.filas.length}`); }
      toast(`${n} gastos importados ✔`);
    }else{
      const P = imPrepVentas(); let n = 0;
      if(P.nuevos.length){ for(const ch of trozos(P.nuevos, 200)){ const {error} = await sb.from('clientes').insert(ch); if(error) throw error; } prog(`Clientes nuevos creados: ${P.nuevos.length}`); }
      for(const ch of trozos(P.ventas, 300)){ const {error} = await sb.from('ventas').insert(ch); if(error) throw error; n += ch.length; prog(`Importando ventas… ${n}/${P.ventas.length}`); }
      const ids = new Set(P.ventas.map(v => v.id));
      const dets = P.det.filter(d => ids.has(d.venta_id)); let m = 0;
      for(const ch of trozos(dets, 500)){ const {error} = await sb.from('venta_detalle').insert(ch); if(error) throw error; m += ch.length; prog(`Importando detalle… ${m}/${dets.length}`); }
      // Actualiza "último pedido" de cada cliente con su fecha más reciente importada
      const ult = {}; P.ventas.forEach(v => { if(v.cliente_id && (!ult[v.cliente_id] || v.fecha > ult[v.cliente_id])) ult[v.cliente_id] = v.fecha; });
      const pend = Object.entries(ult).filter(([cid, f]) => { const c = S.cmap[cid]; return !c || !c.ultima_compra || f > c.ultima_compra; });
      for(const ch of trozos(pend, 10)){ await Promise.all(ch.map(([cid, f]) => sb.from('clientes').update({ultima_compra:f}).eq('id', cid))); }
      toast(`${n} ventas importadas ✔`);
    }
    await cargarBase(true); $('#im-paso2').innerHTML = '<div class="card dest"><h3>✅ Importación terminada</h3><p>Revisa el resultado en el Panel y en Clientes.</p></div>';
  }catch(e){ console.error(e); toast('Se detuvo la importación: ' + errMsg(e), 'err'); prog('Error: ' + errMsg(e) + '. Lo ya importado se conserva.'); btn.disabled = false; }
}

/* ---------------------------------------------------------------------
   ARRANQUE: al abrir la página, recupera la sesión si ya había una
   --------------------------------------------------------------------- */
(async function iniciar(){
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if(!sb){ document.body.innerHTML = '<p style="padding:20px">No se pudo cargar Supabase (revisa tu conexión a internet).</p>'; return; }
  if(SUPABASE_URL.includes('TU-PROYECTO')){ mostrarLogin('⚠ Falta configurar SUPABASE_URL y SUPABASE_ANON_KEY dentro de index.html.'); return; }
  try{
    const {data} = await sb.auth.getSession();
    if(data.session){ S.user = data.session.user; await entrarApp(); return; }
  }catch(e){ console.warn(e); }
  mostrarLogin();
})();
// Service-worker-free offline: los datos base viven en localStorage; la página necesita cargarse al menos una vez con internet.
