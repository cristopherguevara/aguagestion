<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e79">
<title>AquaGestión · Purificadora</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AquaGestión">
<!--
  =====================================================================
   AQUAGESTIÓN  –  index.html  (un solo archivo: HTML + CSS + JS)
   Backend: Supabase (Auth + Postgres con RLS + Storage). Sin Realtime.

   ORGANIZACIÓN DEL ARCHIVO (para que sea fácil de leer):
     PARTE 1  Estilos, estructura, login, navegación y núcleo
              (utilidades, caché en localStorage, cola sin conexión)
     PARTE 2  Dashboards por rol + formulario de venta (3 toques)
     PARTE 3  Buscador de clientes, ficha de cliente, parser de WhatsApp
     PARTE 4  Liquidación diaria, estado de resultados, exportación
     PARTE 5  Gastos, tambos, producción, precios, usuarios, importador

   ANTES DE SUBIR: cambia SUPABASE_URL y SUPABASE_ANON_KEY (más abajo).
   La "anon key" es pública por diseño: la seguridad real la dan las
   políticas RLS del archivo 01_schema.sql.
  =====================================================================
-->
<style>
/* ---------- Paleta: agua profunda + verde-azulado, ámbar para "hoy" ---------- */
:root{
  --tinta:#0c2f36; --azul:#0b6e79; --azul2:#084c54; --agua:#e3f3f4; --espuma:#f3f9f9;
  --ambar:#f2a541; --rojo:#c9443c; --verde:#2a8f62; --gris:#5b6f75; --borde:#cfdfe1;
  --fondo:#eef4f5; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--tinta)}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2}
h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--azul)}
small,.peq{font-size:.85rem;color:var(--gris)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--borde);border-radius:10px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--ambar);outline-offset:1px}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:22px;min-height:22px}

/* ---------- Botones (grandes, para operar con una mano) ---------- */
.btn{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--azul);color:#fff;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.grande{min-height:64px;font-size:1.2rem;width:100%;border-radius:16px}
.btn.sec{background:#fff;color:var(--azul);border:2px solid var(--azul)}
.btn.rojo{background:var(--rojo)} .btn.verde{background:var(--verde)} .btn.ambar{background:var(--ambar);color:var(--tinta)}
.btn.mini{min-height:38px;padding:0 12px;font-size:.9rem;border-radius:9px}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fila-btn .btn{flex:1 1 140px}

/* ---------- Estructura ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--azul2);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
header .marca{font-weight:800;font-size:1.1rem;flex:1;white-space:nowrap}
header .quien{font-size:.8rem;text-align:right;line-height:1.15;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;border-radius:99px;padding:3px 9px;font-size:.78rem;font-weight:700;background:#2a8f62;color:#fff}
.pill.off{background:var(--rojo)} .pill.warn{background:var(--ambar);color:var(--tinta);cursor:pointer;min-height:30px}
nav#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1 0 66px;background:none;border:0;padding:7px 4px;font:inherit;font-size:.72rem;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;cursor:pointer}
nav#nav button span{font-size:1.4rem;line-height:1.1}
nav#nav button.on{color:var(--azul2);font-weight:800;background:var(--agua);box-shadow:inset 0 3px 0 var(--azul)}
main#vista{max-width:1100px;margin:0 auto;padding:12px 12px 96px}
@media(min-width:900px){
  nav#nav{position:sticky;top:52px;bottom:auto;border-top:0;border-bottom:1px solid var(--borde);justify-content:center}
  nav#nav button{flex:0 0 auto;flex-direction:row;font-size:.92rem;padding:8px 16px;gap:7px;min-height:48px}
  nav#nav button.on{box-shadow:inset 0 -3px 0 var(--azul)}
  main#vista{padding-bottom:30px}
  header .quien{max-width:none}
}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--borde)}
.card.dest{border-left:6px solid var(--azul)}
.card.err{border-left:6px solid var(--rojo)}
.cargando{color:var(--gris);text-align:center;padding:30px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.dos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{background:var(--espuma);border-radius:12px;padding:10px 12px;border:1px solid var(--borde)}
.kpi b{display:block;font-size:1.35rem}
.kpi small{display:block}
.pos{color:var(--verde)} .neg{color:var(--rojo)} .aviso{background:#fff5e0;border:1px solid var(--ambar);border-radius:10px;padding:10px;margin:8px 0}
.error{color:var(--rojo);font-weight:600;min-height:1.4em}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--agua);color:var(--azul2)}
.badge.ok{background:#d9f2e5;color:#1c6b47} .badge.mal{background:#fbe0dd;color:#9c2f28} .badge.amb{background:#fdebc8;color:#7a5410}
.tabla-wrap{overflow-x:auto}
table.tabla{width:100%;border-collapse:collapse;font-size:.9rem}
.tabla th,.tabla td{padding:7px 8px;border-bottom:1px solid var(--borde);text-align:left;vertical-align:top}
.tabla th{background:var(--espuma);font-weight:700;position:sticky;top:0}
.tabla td.n,.tabla th.n{text-align:right;white-space:nowrap}
.tabla tfoot td{font-weight:800;background:var(--espuma)}

/* ---------- Repartidor: 7 tarjetas de días ---------- */
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.dia{background:#fff;border:2px solid var(--borde);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-height:74px}
.dia .dn{font-weight:800;font-size:.8rem} .dia .dn .l{display:none}
.dia .dc{font-size:1.5rem;font-weight:800;line-height:1.1}
.dia .de{font-size:.68rem;color:var(--gris)}
.dia.hoy{border-color:var(--ambar);background:#fff8ea}
.dia.hoy .dn::after{content:" · hoy"}
.dia.sel{background:var(--azul);border-color:var(--azul2);color:#fff} .dia.sel .de{color:#d6ecee}
@media(min-width:640px){.dia .dn .c{display:none}.dia .dn .l{display:inline}.dia .de{font-size:.8rem}}
.cli-fila{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--borde)}
.cli-fila:last-child{border-bottom:0}
.cli-info{flex:1;min-width:0} .cli-info b{display:block}
.cli-fila.hecho{opacity:.6}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--agua);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.5rem}

/* ---------- Modal ---------- */
#modal-fondo{position:fixed;inset:0;background:rgba(6,30,34,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal{background:#fff;width:100%;max-width:760px;max-height:95vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal-fondo{align-items:center}#modal{border-radius:20px;max-height:90vh}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mh h2{margin:0}

/* ---------- Formulario de venta ---------- */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prod{border:2px solid var(--borde);border-radius:14px;overflow:hidden;background:#fff}
.prod.on{border-color:var(--azul);background:var(--agua)}
.prod .pn{padding:10px;cursor:pointer;min-height:66px;border-left:6px solid var(--borde)}
.prod .pn b{display:block;line-height:1.15} .prod .pn small{color:var(--azul2);font-weight:700}
.prod[data-cat="agua"] .pn{border-left-color:#0b6e79;background:#eaf7f8}
.prod[data-cat="garrafon"] .pn{border-left-color:#084c54;background:#e6f2f3}
.prod[data-cat="hielo"] .pn{border-left-color:#2f9bd6;background:#eaf5fc}
.prod[data-cat="bolsipura"] .pn{border-left-color:#f2a541;background:#fef6e9}
.prod[data-cat="dispensador"] .pn{border-left-color:#2a8f62;background:#eaf7f0}
.prod[data-cat="otro"] .pn{border-left-color:#8a97a0;background:#f2f4f5}
.prod.on .pn{background:transparent}
.cat-ico{font-size:1.15rem;margin-right:4px}
.stp{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--borde)}
.stp button{width:52px;height:48px;border:0;background:transparent;font-size:1.5rem;font-weight:800;color:var(--azul);cursor:pointer}
.stp span{font-size:1.2rem;font-weight:800}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;border:2px solid var(--borde);background:#fff;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--azul);color:#fff;border-color:var(--azul2)}
.seg button:disabled{opacity:.4}
.total-grande{font-size:2rem;font-weight:800;text-align:center;margin:10px 0 4px}
.res-lista{border:1px solid var(--borde);border-radius:10px;margin-top:6px;max-height:280px;overflow:auto}
.res-item{padding:10px 12px;border-bottom:1px solid var(--borde);cursor:pointer}
.res-item:last-child{border-bottom:0} .res-item:hover,.res-item:active{background:var(--agua)}
details.ayuda{background:var(--espuma);border:1px solid var(--borde);border-radius:10px;padding:8px 12px;margin:8px 0}
details.ayuda summary{cursor:pointer;font-weight:700;color:var(--azul2)}
.solo-print{display:none}
.ro{padding:10px 12px;background:var(--espuma);border-radius:10px;min-height:44px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;font-weight:600;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--rojo)} #toast.warn{background:#8a5a00}

/* ---------- Login ---------- */
#pantalla-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--azul2),var(--azul) 60%,#2aa0aa)}
.login-caja{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:400px}
.login-caja h1{font-size:1.7rem;margin:0}
.login-caja .sub{margin:2px 0 14px;color:var(--gris)}
.gota{font-size:2.6rem}

/* ---------- Impresión / PDF (window.print) ---------- */
@media print{
  .solo-print{display:inline!important}
  header.top,nav#nav,.no-print,#toast,#modal-fondo{display:none!important}
  body{background:#fff} main#vista{padding:0;max-width:none}
  .card{border:1px solid #bbb;break-inside:avoid}
  .tabla-wrap{overflow:visible}
}
</style>
</head>
<body>

<!-- ============ PANTALLA DE LOGIN ============ -->
<section id="pantalla-login" hidden>
  <div class="login-caja">
    <div class="gota">💧</div>
    <h1>AquaGestión</h1>
    <p class="sub">Purificadora y distribuidora de agua</p>
    <form onsubmit="return hacerLogin(event)">
      <label for="l-email">Correo</label>
      <input id="l-email" type="email" autocomplete="username" required>
      <label for="l-pass">Contraseña</label>
      <input id="l-pass" type="password" autocomplete="current-password" required>
      <div style="height:14px"></div>
      <button class="btn grande" id="l-btn" type="submit">Entrar</button>
      <p id="l-err" class="error"></p>
    </form>
  </div>
</section>

<!-- ============ APLICACIÓN ============ -->
<div id="app" hidden>
  <header class="top">
    <div class="marca">💧 AquaGestión</div>
    <span id="estado-red" class="pill">En línea</span>
    <button id="badge-cola" class="pill warn" hidden onclick="sincronizar(true)"></button>
    <div class="quien" id="quien"></div>
    <button class="btn mini sec" onclick="salir()">Salir</button>
  </header>
  <nav id="nav"></nav>
  <main id="vista"></main>
</div>

<div id="modal-fondo" hidden><div id="modal"></div></div>
<div id="toast"></div>

<!-- Librería de Supabase (gratuita, por CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
/* =====================================================================
   PARTE 1 · NÚCLEO
   ===================================================================== */

// ---------- CONFIGURACIÓN (cambia estas dos líneas) ----------
const SUPABASE_URL      = 'https://gacualjiiudcbucwfecs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhY3VhbGppaXVkY2J1Y3dmZWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NTgwNDgsImV4cCI6MjEwNjEzNDA0OH0.iny-tAjEA7iEt0qey8J_6Lw0sEeR7Gg91glcqG_pNp4';
const ZONA      = 'America/Guatemala';
const CACHE_MIN = 5;                     // minutos entre refrescos de la caché de clientes

// Cliente Supabase (sin Realtime: nunca se abren canales)
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ---------- Estado global ----------
const S = {
  user:null, perfil:null, rol:null,
  base:null,                 // datos cacheados {productos,precios,pcs,rutas,usuarios,cats,clientes}
  clientes:[], cmap:{}, productos:[], precios:[], pc:{}, rutas:[], usuarios:[], cats:[],
  vista:'inicio', diaSel:null
};
const VISTAS = {};           // cada pantalla se registra aquí (partes 2 a 5)
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
// Frecuencia de visita: valores fijos (no texto libre) para poder calcular cumplimiento
const FRECUENCIAS = [['diario','Diario'],['varios_dias_semana','Varios días a la semana'],['semanal','Cada semana'],['quincenal','Cada 15 días'],['mensual','Cada mes']];
const frecLabel = v => (FRECUENCIAS.find(f => f[0] === v) || [,'Sin frecuencia'])[1];

// ---------- Utilidades ----------
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Quita acentos, pasa a minúsculas: "José" -> "jose"
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const Q   = n => 'Q ' + (Number(n)||0).toLocaleString('es-GT',{minimumFractionDigits:2, maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const r2  = n => Math.round((Number(n)||0)*100)/100;
const hoy = () => new Date().toLocaleDateString('en-CA', {timeZone:ZONA});          // AAAA-MM-DD en Guatemala
const diaSem = f => { const [y,m,d] = f.split('-').map(Number); return ((new Date(y,m-1,d).getDay()+6)%7)+1; }; // 1=lun..7=dom
const difDias = f => Math.round((Date.parse(hoy()) - Date.parse(f)) / 864e5);
const fmtFecha = f => { if(!f) return '—'; const [y,m,d] = f.split('-'); return `${d}/${m}/${y}`; };
// Días de ruta del cliente: usa el arreglo nuevo; si está vacío cae al campo viejo (clientes importados o no editados aún)
const diasCliente = c => (c.dias_semana && c.dias_semana.length) ? c.dias_semana : (c.dia_semana ? [c.dia_semana] : []);
const txtDiasCliente = c => { const d = diasCliente(c); return d.length ? d.slice().sort((a,b)=>a-b).map(x => DIAS[x-1].slice(0,3)).join(', ') : 'sin día'; };
// ¿Le toca a este cliente ser atendido el día "dow" (1=lun..7=dom)?
// diario: todos los días · varios_dias_semana / cada semana: solo los días marcados, toda semana
// cada 15 días / cada mes: solo cuando ya pasaron 15 o 30 días desde su último pedido (o si nunca ha comprado)
function clienteDebeAtender(c, dow){
  if(c.frecuencia === 'diario') return true;
  if(!diasCliente(c).includes(dow)) return false;
  if(c.frecuencia === 'quincenal') return !c.ultima_compra || difDias(c.ultima_compra) >= 15;
  if(c.frecuencia === 'mensual')   return !c.ultima_compra || difDias(c.ultima_compra) >= 30;
  return true;   // diario ya se resolvió arriba; varios_dias_semana, semanal o sin frecuencia: el día marcado basta
}
// Agrupa los clientes por día de la semana (1..7) para las pantallas de ruta.
// Un cliente "diario" aparece en los 7 días; los demás, solo en los días que tienen marcados.
function construirPorDia(clientes){
  const porDia = {1:[],2:[],3:[],4:[],5:[],6:[],7:[]};
  clientes.forEach(c => {
    if(c.frecuencia === 'diario'){ for(let d=1; d<=7; d++) porDia[d].push(c); return; }
    diasCliente(c).forEach(d => { if(porDia[d]) porDia[d].push(c); });
  });
  return porDia;
}
const haceTxt = f => { if(!f) return 'sin pedidos'; const d = difDias(f); return d<=0 ? 'hoy' : d===1 ? 'ayer' : `hace ${d} d`; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem('ag_'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ag_'+k, JSON.stringify(v)); }catch(e){ console.warn('localStorage lleno', e); } },
  del(k){ try{ localStorage.removeItem('ag_'+k); }catch(e){} }
};
const nombreUsuario = id => (S.usuarios.find(u => u.id === id) || {}).nombre || '—';

function toast(msg, tipo='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + tipo;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 3800);
}
function modal(html, clase=''){
  const m = $('#modal'); m.className = clase; m.innerHTML = html;
  $('#modal-fondo').hidden = false; m.scrollTop = 0; return m;
}
function cerrarModal(){ $('#modal-fondo').hidden = true; $('#modal').innerHTML = ''; }

// Traduce errores de Supabase a mensajes entendibles
function errMsg(e){
  if(!e) return 'Error desconocido';
  if(e.code === '42501' || /row-level security|permission denied/i.test(e.message||'')) return 'No tienes permiso para hacer esto.';
  if(e.code === '23505') return 'Ese registro ya existe (dato duplicado).';
  if(e.code === '23514') return 'Algún dato no cumple las reglas (revisa forma de pago y cliente).';
  if(/fetch|network|load failed/i.test(e.message||'')) return 'Sin conexión a internet.';
  return e.message || String(e);
}
const esRed = e => !navigator.onLine || (e && !e.code && /fetch|network|load failed/i.test(e.message||''));

// Llama a una función SQL (RPC) y devuelve las filas
async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args || {}); if(error) throw error; return data || []; }
// Trae TODAS las filas de una consulta (Supabase limita a 1000 por petición)
async function paginar(fabrica){
  let out = [], i = 0;
  for(;;){
    const {data, error} = await fabrica().range(i, i+999);
    if(error) throw error;
    out = out.concat(data);
    if(data.length < 1000) break;
    i += 1000;
  }
  return out;
}

// Exportar a CSV (con BOM para que Excel respete los acentos)
function descargarCSV(nombre, filas){
  if(!filas || !filas.length){ toast('No hay datos para exportar', 'warn'); return; }
  const cols = Object.keys(filas[0]);
  const cel = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const csv = '\uFEFF' + [cols.map(cel).join(',')].concat(filas.map(f => cols.map(c => cel(f[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `${nombre}_${hoy()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------------------------------------------------------------------
   CACHÉ DE DATOS BASE (localStorage) – buscador instantáneo y modo offline
   --------------------------------------------------------------------- */
const COLS_CLIENTE = 'id,nombre,direccion_corta,direccion_completa,telefono,zona,ruta_id,dia_semana,dias_semana,lat,lng,maps_link,foto_url,garrafones_prestados,nit,ultima_compra,estado,frecuencia,promedio_q,notas';

function aplicarBase(b){
  S.base = b;
  S.productos = b.productos; S.precios = b.precios; S.rutas = b.rutas; S.usuarios = b.usuarios; S.cats = b.cats; S.clientes = b.clientes;
  S.negocio = (b.negocio && b.negocio[0]) || {};
  S.pc = {}; (b.pcs || []).forEach(x => S.pc[x.cliente_id + '|' + x.producto_id] = x.precio_especial);
  S.cmap = {};
  S.clientes.forEach(c => {
    // _b = texto de búsqueda sin acentos (no se guarda en localStorage)
    Object.defineProperty(c, '_b', {value: norm(`${c.nombre} ${c.direccion_corta} ${c.telefono||''}`), enumerable:false, writable:true, configurable:true});
    S.cmap[c.id] = c;
  });
}
async function cargarBase(forzar){
  const meta = ls.get('meta', {t:0}), cache = ls.get('base', null);
  const viejo = Date.now() - meta.t > CACHE_MIN*60000;
  if(cache && ((!forzar && !viejo) || !navigator.onLine)){ aplicarBase(cache); return; }
  if(!navigator.onLine){ if(cache) aplicarBase(cache); return; }
  try{
    const g = (t, c, o) => sb.from(t).select(c).order(o).then(r => { if(r.error) throw r.error; return r.data; });
    const [productos, precios, pcs, rutas, usuarios, cats, clientes, negocio] = await Promise.all([
      g('productos','*','nombre'), g('precios','*','vigente_desde'), g('precios_cliente','*','cliente_id'),
      g('rutas','*','nombre'), g('usuarios_perfil','*','nombre'), g('categorias_egreso','*','nombre'),
      paginar(() => sb.from('clientes').select(COLS_CLIENTE).order('direccion_corta')),
      sb.from('negocio_config').select('*').then(r => r.error ? [] : r.data)
    ]);
    const base = {productos, precios, pcs, rutas, usuarios, cats, clientes, negocio};
    ls.set('base', base); ls.set('meta', {t:Date.now()}); aplicarBase(base);
  }catch(e){
    console.warn('No se pudo refrescar la caché', e);
    if(cache) aplicarBase(cache); else if(!S.base) toast('No se pudieron cargar los datos: ' + errMsg(e), 'err');
  }
}
const persistirBase = () => { if(S.base) ls.set('base', S.base); };
// Actualiza un cliente en memoria y caché sin ir al servidor
function tocarClienteLocal(id, cambios){
  const c = S.cmap[id]; if(!c) return; Object.assign(c, cambios);
  Object.defineProperty(c, '_b', {value: norm(`${c.nombre} ${c.direccion_corta} ${c.telefono||''}`), enumerable:false, writable:true, configurable:true});
  persistirBase();
}

// Precio especial del cliente > precio vigente por tipo (tienda/domicilio) > domicilio
function precioDe(pid, cid, tipo, mayoreo){
  if(cid && S.pc[cid+'|'+pid] != null) return +S.pc[cid+'|'+pid];   // precio especial del cliente: siempre gana
  const h = hoy();
  const buscar = t => S.precios.filter(p => p.producto_id===pid && p.tipo_cliente===t && p.vigente_desde<=h)
                               .sort((a,b) => b.vigente_desde.localeCompare(a.vigente_desde))[0];
  const p = (mayoreo && buscar('mayoreo')) || buscar(tipo) || buscar('domicilio') || buscar('tienda');
  return p ? +p.precio : 0;
}
const tienePrecioEspecial = (pid, cid) => cid && S.pc[cid+'|'+pid] != null;

/* ---------------------------------------------------------------------
   COLA SIN CONEXIÓN
   Cada venta/gasto/tambo se guarda con un ID generado en el teléfono.
   Si no hay internet, se guarda en localStorage y se envía al volver.
   Si el envío se repite, el ID duplicado se ignora (no hay ventas dobles).
   --------------------------------------------------------------------- */
async function ejecutarOp(op){
  const ins = async (tabla, filas) => {
    if(!filas || !filas.length) return;
    const {error} = await sb.from(tabla).insert(filas);
    if(error && error.code !== '23505') throw error;
  };
  if(op.k === 'venta'){ await ins('ventas',[op.venta]); await ins('venta_detalle',op.detalle); await ins('tambos_mov',op.tambos); }
  else if(op.k === 'tambo')  await ins('tambos_mov', op.tambos);
  else if(op.k === 'egreso') await ins('egresos', [op.egreso]);
}
// Intenta enviar; si no hay red la guarda en cola. Devuelve {ok} o {cola}
async function enviar(op){
  if(!navigator.onLine){ encolar(op); return {cola:true}; }
  try{ await ejecutarOp(op); return {ok:true}; }
  catch(e){ if(esRed(e)){ encolar(op); return {cola:true}; } throw e; }
}
function encolar(op){ const c = ls.get('cola',[]); c.push(op); ls.set('cola', c); pintarCola(); toast('Sin conexión: guardado en el teléfono ⏳ (se enviará solo)', 'warn'); }
async function sincronizar(manual){
  if(sincronizar.on) return;
  if(!navigator.onLine){ if(manual) toast('Aún no hay internet', 'warn'); return; }
  const cola = ls.get('cola', []);
  if(!cola.length){ if(manual) toast('Todo está sincronizado ✔'); return; }
  sincronizar.on = true;
  let ok = 0, i = 0; const fall = ls.get('fallidos', []);
  for(; i < cola.length; i++){
    try{ await ejecutarOp(cola[i]); ok++; }
    catch(e){ if(esRed(e)) break; cola[i].error = errMsg(e); fall.push(cola[i]); }
  }
  ls.set('cola', cola.slice(i)); ls.set('fallidos', fall);
  sincronizar.on = false; pintarCola();
  if(ok) toast(`Se sincronizaron ${ok} registro(s) ✔`);
  if(fall.length) toast(`${fall.length} registro(s) fueron rechazados por el servidor (revisa con el supervisor)`, 'err');
  if(ok && S.vista === 'inicio') ir('inicio');
}
function pintarCola(){
  const n = ls.get('cola', []).length, b = $('#badge-cola');
  b.hidden = !n; b.textContent = `⏳ ${n} pendiente${n===1?'':'s'}`;
}
function pintarRed(){
  const e = $('#estado-red'), on = navigator.onLine;
  e.textContent = on ? 'En línea' : 'Sin conexión'; e.className = 'pill' + (on ? '' : ' off');
}

const cierreDe = async (f, uid) => {

  if(error) throw error; return data;

// Resumen del día de UN usuario: ventas, egresos y efectivo esperado
async function resumenDia(f, uid){
  const [v, e] = await Promise.all([
    sb.from('ventas').select('id,total_q,forma_pago,tipo,estado_credito,cliente_id,notas,created_at').eq('fecha', f).eq('usuario_id', uid).order('created_at'),
    sb.from('egresos').select('id,monto_q,descripcion,subcategoria,categoria_id,created_at').eq('fecha', f).eq('usuario_id', uid).order('created_at')
  ]);
  if(v.error) throw v.error; if(e.error) throw e.error;
  const ventas = v.data, egresos = e.data;
  const por = fp => r2(ventas.filter(x => x.forma_pago === fp).reduce((a,x) => a + +x.total_q, 0));
  const total = r2(ventas.reduce((a,x) => a + +x.total_q, 0));
  const ef = por('efectivo'), tr = por('transferencia'), cr = por('credito');
  const gastos = r2(egresos.reduce((a,x) => a + +x.monto_q, 0));
  // Efectivo esperado = efectivo cobrado − gastos pagados de ese efectivo
  return {ventas, egresos, total, ef, tr, cr, gastos, esperado: r2(ef - gastos)};
}

function imprimirComprobante(venta, items, cliente){

async function guardarVenta(){
  const btn = $('#v-guardar'); btn.disabled = true;
  const f = hoy(), vid = uuid(), cid = V.cliente ? V.cliente.id : null, items = [];
  let total = 0;
  for(const [pid, q] of Object.entries(V.cart)){
    if(q <= 0) continue;
    const pr = precioDe(pid, cid, V.tipo, V.mayoreo), st = r2(q * pr); total += st;
    items.push({id:uuid(), venta_id:vid, producto_id:pid, cantidad:q, precio_unitario:pr, subtotal_q:st});
  }
  const tambos = [];
  if(cid && V.prest > 0) tambos.push({id:uuid(), fecha:f, cliente_id:cid, tipo:'prestado',   cantidad:V.prest, usuario_id:S.user.id});
  if(cid && V.recup > 0) tambos.push({id:uuid(), fecha:f, cliente_id:cid, tipo:'recuperado', cantidad:V.recup, usuario_id:S.user.id});
  if(!items.length && !tambos.length){ toast('Agrega al menos un producto', 'warn'); btn.disabled = false; return; }
  if(V.forma === 'credito' && !cid){ toast('El crédito necesita un cliente', 'warn'); btn.disabled = false; return; }
  if(items.some(i => i.precio_unitario === 0) && !confirm('Hay productos con precio Q 0.00. ¿Guardar de todos modos?')){ btn.disabled = false; return; }
  const venta = {id:vid, fecha:f, usuario_id:S.user.id, cliente_id:cid, tipo:V.tipo, forma_pago:V.forma,
                 estado_credito: V.forma === 'credito' ? 'pendiente' : 'na', total_q:r2(total), notas:((V.notas||'').trim() || null)};
  try{
    const r = await enviar(items.length ? {k:'venta', venta, detalle:items, tambos} : {k:'tambo', tambos});
    if(cid){   // actualiza la caché local para que el buscador refleje el cambio
      const c = S.cmap[cid];
      tocarClienteLocal(cid, {ultima_compra: items.length ? f : c.ultima_compra,
        garrafones_prestados: Math.max(0, (c.garrafones_prestados||0) + V.prest - V.recup)});
      if(items.length){ const u = ls.get('ult', {}); u[cid] = {...V.cart}; ls.set('ult', u); }
    }
    cerrarModal();
    toast(r.cola ? 'Venta guardada sin conexión ⏳' : `Venta guardada ✔  ${Q(total)}`);
    if(items.length && V.cliente && V.cliente.nit) imprimirComprobante(venta, items, V.cliente);
    if(S.vista === 'inicio') ir('inicio');
  }catch(e){ toast(errMsg(e), 'err'); btn.disabled = false; }
}
// Último pedido de un cliente {producto_id: cantidad}; usa caché si no hay internet
async function ultimoPedido(cid){
  const u = ls.get('ult', {});
  if(navigator.onLine){
    try{
      const {data, error} = await sb.from('ventas').select('id,venta_detalle(producto_id,cantidad)').eq('cliente_id', cid)
        .order('fecha', {ascending:false}).order('created_at', {ascending:false}).limit(1);
      if(error) throw error;
      if(data.length && data[0].venta_detalle.length){
        const cart = {}; data[0].venta_detalle.forEach(d => cart[d.producto_id] = +d.cantidad);
        u[cid] = cart; ls.set('ult', u); return cart;
      }
      return null;
    }catch(e){ if(!esRed(e)) throw e; }
  }
  return u[cid] || null;
}

function pintarDia(){
  const d = S.diaSel, hoyDia = diaSem(hoy());

  if(S.soloMiRuta && misRutas.length) lst = lst.filter(c => misRutas.includes(c.ruta_id));
  // "Debe" = según su frecuencia, a este cliente le toca ser atendido este día (no solo tener el día marcado:
  // los de cada 15 días / cada mes solo cuentan cuando ya les toca según su último pedido).
  const debe = c => clienteDebeAtender(c, d);
  lst.sort((a,b) => (S.visitados.has(a.id) - S.visitados.has(b.id)) || (debe(b) - debe(a)) || a.direccion_corta.localeCompare(b.direccion_corta, 'es', {numeric:true}));
  const debidos = lst.filter(debe), hechos = debidos.filter(c => S.visitados.has(c.id)).length;

}

/* ---------------------------------------------------------------------
   BUSCADOR (CRÍTICO): un solo campo, nombre O dirección corta,
   sin distinguir mayúsculas ni acentos. Busca primero en la caché local
   (instantáneo, <2 s). Si no encuentra y hay internet, consulta a Supabase
   con ilike sobre la columna "busqueda" (texto sin acentos).
   --------------------------------------------------------------------- */
async function buscar(q){
  const nq = norm(q); if(!nq) return [];
  const toks = nq.split(' ');
  let r = S.clientes.filter(c => toks.every(t => c._b.includes(t)));
  r.sort((a,b) => {
    const pa = norm(a.direccion_corta).startsWith(nq) || norm(a.nombre).startsWith(nq) ? 0 : 1;
    const pb = norm(b.direccion_corta).startsWith(nq) || norm(b.nombre).startsWith(nq) ? 0 : 1;
    return pa - pb || a.direccion_corta.localeCompare(b.direccion_corta, 'es', {numeric:true});
  });
  if(!r.length && nq.length >= 3 && navigator.onLine){
    try{
      const {data} = await sb.from('clientes').select(COLS_CLIENTE).ilike('busqueda', '%' + nq.replace(/[%_]/g,'') + '%').limit(20);
      (data || []).forEach(c => { if(!S.cmap[c.id]) S.cmap[c.id] = c; });
      r = data || [];
    }catch(e){ /* sin red: se queda con lo local */ }
  }
  return r.slice(0, 30);
}

/* ---------------------------------------------------------------------
   UBICACIÓN: parser de coordenadas o links de Google Maps
   Acepta:  14.6349, -90.5069   ·   https://www.google.com/maps/@14.63,-90.50,17z
            https://maps.google.com/?q=14.63,-90.50   ·   https://maps.app.goo.gl/xxxx
   Los links cortos (goo.gl) no se pueden "abrir" desde el navegador para leer las
   coordenadas: en ese caso se guarda el link y funciona el botón "Abrir en Google Maps".
   --------------------------------------------------------------------- */
function parseUbicacion(t){
  t = String(t || '').trim(); if(!t) return null;
  let lat = null, lng = null, link = null;
  const url = t.match(/https?:\/\/\S+/i);
  if(url) link = url[0];
  const dec = decodeURIComponent((url ? url[0] : t).replace(/%2C/gi, ','));
  const m = dec.match(/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/)
         || dec.match(/[?&](?:q|ll|query|destination|daddr)=\s*(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/i)
         || dec.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/)
         || (!url && t.match(/^\s*(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)\s*$/));
  if(m){ lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
  if(lat !== null && (Math.abs(lat) > 90 || Math.abs(lng) > 180)){ lat = lng = null; }
  if(lat === null && !link) return null;
  if(lat !== null && !link) link = `https://www.google.com/maps?q=${lat},${lng}`;
  return {lat, lng, link};
}
// Toma la ubicación GPS del teléfono (útil cuando se está parado frente a la casa del cliente)
function usarUbicacionActual(inputId){
  if(!navigator.geolocation){ toast('Tu navegador no permite obtener la ubicación', 'warn'); return; }
  toast('Obteniendo tu ubicación…');
  navigator.geolocation.getCurrentPosition(
    pos => { const i = $('#'+inputId); if(i) i.value = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6); toast('Ubicación capturada ✔'); },
    err => toast('No se pudo obtener tu ubicación: ' + (err.code === 1 ? 'permiso denegado' : 'revisa el GPS del teléfono'), 'err'),
    {enableHighAccuracy:true, timeout:10000});
}
function urlMapa(c){
  if(c.lat != null && c.lng != null) return `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
  return c.maps_link || null;
}
function abrirMapa(){ const u = urlMapa(S.fc); if(!u) return toast('Este cliente aún no tiene ubicación guardada', 'warn'); window.open(u, '_blank'); }
async function guardarUbicacion(){
  const p = parseUbicacion($('#f-ubi').value);
  if(!p){ toast('No entendí la ubicación. Pega las coordenadas (14.6349, -90.5069) o un link de Google Maps', 'warn'); return; }
  if(p.lat !== null && (p.lat < 13 || p.lat > 18.5 || p.lng < -92.5 || p.lng > -88) &&
     !confirm('Esas coordenadas quedan fuera de Guatemala. ¿Guardarlas de todos modos?')) return;
  const obj = {maps_link:p.link}; if(p.lat !== null){ obj.lat = p.lat; obj.lng = p.lng; }
  const {error} = await sb.from('clientes').update(obj).eq('id', S.fc.id);
  if(error) return toast(errMsg(error), 'err');
  Object.assign(S.fc, obj); tocarClienteLocal(S.fc.id, obj);
  toast(p.lat !== null ? 'Ubicación guardada ✔' : 'Link guardado ✔ (no pude leer coordenadas del link corto)');
  abrirFicha(S.fc.id);

/* ---------------------------------------------------------------------
   FOTO DEL LUGAR → Supabase Storage (bucket fotos-clientes). Nunca base64 en la BD.
   La foto se reduce a 1280 px / JPEG antes de subir (ahorra datos y espacio gratuito).
   --------------------------------------------------------------------- */
function comprimir(file, max = 1280, calidad = .72){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('No se pudo comprimir la foto')); }, 'image/jpeg', calidad);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

    const up = await sb.storage.from('fotos-clientes').upload(path, blob, {contentType:'image/jpeg', upsert:false});

/* ---------------------------------------------------------------------
   PARSER DE WHATSAPP (CRÍTICO)
   Entiende: cantidad + producto (garrafón, hielo de N, bolsipura, recarga)
             y la dirección corta (después de "a", "en" o "para"; o antes de los productos).
   Ejemplos:  "2 garrafones a 10 calle A 12-25"
              "3 hielos de 5 a 14 av 9-74"
              "1 bolsipura y 2 garrafones a Mercado San Jose"
   --------------------------------------------------------------------- */
const PAL_NUM = {un:1, una:1, uno:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10};
// grupos: 1 = cantidad · 2 = producto · 3 = valor del hielo ("hielos de 5")
const RE_PROD = /\b(\d+|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\s*(?:x\s*)?(garrafon(?:es)?|garrafa(?:s)?|tambo(?:s)?|recarga(?:s)?|bolsipura(?:s)?|(?:hielo(?:s)?|bolsa(?:s)?\s+de\s+hielo)(?:\s+de\s+(?:q\.?\s*)?(\d+))?)/g;

function matchProducto(clave, valor){
  const act = S.productos.filter(p => p.activo), nn = p => norm(p.nombre);
  if(/^(garraf|tambo)/.test(clave)) return act.find(p => p.categoria === 'agua' && nn(p).startsWith('garrafon')) || act.find(p => p.categoria === 'agua') || null;
  if(/^recarga/.test(clave))        return act.find(p => nn(p).includes('recarga')) || matchProducto('garrafon');
  if(/^bolsipura/.test(clave))      return act.find(p => p.categoria === 'bolsipura') || null;
  if(/hielo|bolsa/.test(clave)){
    const h = act.filter(p => p.categoria === 'hielo');
    if(valor) return h.find(p => new RegExp('q\\s*' + valor + '\\b').test(nn(p))) || null;
    return h.find(p => /q\s*5\b/.test(nn(p))) || h[0] || null;   // sin valor: asume Q5 (el usuario puede cambiarlo)
  }
  return null;
}
function limpiarDir(s){
  let t = String(s || '');
  for(let i = 0; i < 3; i++){
    t = t.replace(/^[\s,:;.\-–—]+/, '').replace(/^(?:a la|al|a|en|para|hacia|de)\s+/i, '');
    t = t.replace(/^(?:hola|buen(?:o|a)s?\s*(?:d[ií]as|tardes|noches)?|buen d[ií]a|quiero|necesito|necesitamos|favor de|por favor|me (?:manda|trae|puede[ns]? traer|puede[ns]? mandar)|pedido(?: para)?|env[ií]en?me|m[aá]ndame)\b[\s,:;.!]*/i, '');
  }
  return t.replace(/\b(?:por favor|gracias|porfa|pf)\b.*$/i, '').replace(/[\s,.;:!]+$/, '').trim();
}
function parseWhatsApp(texto){
  const tf = String(texto || '').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
  const tn = tf.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();   // misma longitud que tf
  const lineas = [], ms = [...tn.matchAll(RE_PROD)];
  ms.forEach(m => {
    const cant = /^\d+$/.test(m[1]) ? parseInt(m[1]) : PAL_NUM[m[1]];
    const valor = m[3] ? parseInt(m[3]) : null, esHielo = /hielo|bolsa/.test(m[2]) && !/^bolsipura/.test(m[2]);
    const p = matchProducto(m[2], valor);
    lineas.push({cant, clave:m[2], valor, pid:p ? p.id : null, asumido: esHielo && !valor});
  });
  let dir = '';
  if(ms.length){
    const ult = ms[ms.length - 1], fin = ult.index + ult[0].length;
    dir = limpiarDir(tf.slice(fin));
    if(!dir) dir = limpiarDir(tf.slice(0, ms[0].index));      // "Mercado San Jose: 2 garrafones"
  } else dir = limpiarDir(tf);
  return {lineas, dir};
}
// Normaliza direcciones para comparar: "5a Avenida 3-40, Z2" ≈ "5 av 3-40 z2"
function normDir(s){
  return norm(s).replace(/(\d)(?:a|ra|da|ta|va|ma|na|o|era|ero)\b/g, '$1').replace(/\bavenida\b/g, 'av').replace(/\bav\.?(?=\s|\d|$)/g, 'av')
    .replace(/\bzona\s*(\d+)/g, 'z$1').replace(/\bz\.?\s*(\d+)/g, 'z$1').replace(/[.,;:#°º]/g, ' ').replace(/\s+/g, ' ').trim();
}
const STOP = new Set(['av', 'calle', 'z', 'de', 'la', 'el', 'los', 'las', 'del', 'y']);
function candidatosDireccion(dir){
  const nd = normDir(dir); if(!nd) return [];
  const tk = new Set(nd.split(' ').filter(t => !STOP.has(t)));
  const out = [];
  S.clientes.forEach(c => {
    const cd = normDir(c.direccion_corta), nom = normDir(c.nombre);
    let s = 0;
    if(cd === nd) s = 100;
    else if(nd.length >= 4 && cd.length >= 4 && (cd.includes(nd) || nd.includes(cd))) s = 85;
    else if(nd.length >= 4 && nom.includes(nd)) s = 75;
    else {
      const ct = new Set(cd.split(' ').filter(t => !STOP.has(t)));
      const inter = [...tk].filter(t => ct.has(t)).length, uni = new Set([...tk, ...ct]).size;
      s = uni ? Math.round(70 * inter / uni) : 0;
    }
    if(s >= 40) out.push({c, s});
  });
  return out.sort((a, b) => b.s - a.s).slice(0, 5);
}

let W = null;   // estado del parser
function interpretarWA(){
  const txt = $('#wa-txt').value.trim();
  if(!txt) return toast('Pega primero el mensaje', 'warn');
  const p = parseWhatsApp(txt);
  if(!p.lineas.length) { $('#wa-res').innerHTML = '<div class="aviso">No encontré cantidades ni productos. Ejemplo: “2 garrafones a 10 calle A 12-25”.</div>'; return; }
  const cand = candidatosDireccion(p.dir);
  const auto = cand.length && cand[0].s >= 85 && (cand[0].s === 100 || !cand[1] || cand[1].s < 85) ? cand[0].c : null;
  W = {lineas:p.lineas, dir:p.dir, cand, sel:auto};
  pintarWA();
}
function pintarWA(){
  const opcs = S.productos.filter(p => p.activo);
  const lin = W.lineas.map((l, i) => `<div class="grid" style="grid-template-columns:80px 1fr 48px;align-items:center;margin-bottom:6px">

      <select onchange="W.lineas[${i}].pid=this.value;W.lineas[${i}].asumido=false"><option value="">⚠ Elegir producto…</option>${opcs.map(p => `<option value="${p.id}" ${l.pid===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
      <button class="btn mini rojo" onclick="W.lineas.splice(${i},1);pintarWA()">✕</button></div>
      ${l.asumido ? '<p class="peq" style="margin:-2px 0 6px">Asumí hielo de Q5 porque no indicaron el valor. Cámbialo si hace falta.</p>' : ''}${!l.pid ? `<p class="peq neg" style="margin:-2px 0 6px">No encontré un producto para “${esc(l.clave)}${l.valor ? ' Q'+l.valor : ''}”.</p>` : ''}`).join('');
  let cliHtml;
  if(W.sel){
    cliHtml = `<div class="card dest" style="margin:6px 0"><b>${esc(W.sel.direccion_corta)}</b> · ${esc(W.sel.nombre)}<br><small>🛢️ ${W.sel.garrafones_prestados||0} prestados · ${haceTxt(W.sel.ultima_compra)}</small>
      <div class="fila-btn"><button class="btn mini sec" onclick="W.sel=null;pintarWA()">No es este cliente</button></div></div>`;
  } else {
    cliHtml = (W.cand.length ? `<p class="aviso" style="margin:6px 0"><b>Elige el cliente correcto</b> (dirección detectada: “${esc(W.dir)}”)</p>
        <div class="res-lista">${W.cand.map((x, i) => `<div class="res-item" onclick="W.sel=W.cand[${i}].c;pintarWA()"><b>${esc(x.c.direccion_corta)}</b> · ${esc(x.c.nombre)} <span class="badge">${x.s}%</span></div>`).join('')}</div>`
      : `<p class="aviso" style="margin:6px 0">No encontré un cliente para “${esc(W.dir) || '(sin dirección)'}”.</p>`) +
      `<div class="fila-btn"><button class="btn sec" onclick="formNuevoCliente(W.dir, c => { W.sel = c; cerrarModal(); ir('clientes'); setTimeout(() => { $('#wa-res').innerHTML=''; abrirVenta({cliente:c, cart:waCart()}); }, 50); }, () => { cerrarModal(); ir('clientes'); })">+ Crear cliente nuevo con “${esc(W.dir) || 'esta dirección'}”</button></div>`;
  }
  $('#wa-res').innerHTML = `<h3 style="margin-top:14px">Esto entendí</h3>${lin}
    <button class="btn mini sec" onclick="W.lineas.push({cant:1,clave:'',valor:null,pid:null,asumido:false});pintarWA()">+ Agregar producto</button>
    <h3>Cliente</h3>${cliHtml}
    <div class="fila-btn"><button class="btn grande verde" onclick="continuarWA()">Continuar a la venta →</button></div>`;
}
function waCart(){
  const cart = {}; W.lineas.forEach(l => { if(l.pid && l.cant > 0) cart[l.pid] = (cart[l.pid] || 0) + l.cant; }); return cart;
}
function continuarWA(){
  const cart = waCart();

  if(!W.sel && S.rol === 'repartidor') return toast('Elige o crea el cliente', 'warn');
  if(!W.sel && !confirm('No elegiste cliente: la venta será de mostrador. ¿Continuar?')) return;
  abrirVenta({cliente:W.sel, cart});
}

/* ---------------------------------------------------------------------
   LIQUIDACIÓN DIARIA (con reconfirmación manual de efectivo)
   Regla clave: el campo de efectivo NO viene pre-llenado. La persona debe
   contar el dinero y escribir el monto. Si no coincide con lo esperado,
   se exige una justificación escrita.
   diferencia = efectivo entregado − efectivo esperado  (negativo = faltante)
   --------------------------------------------------------------------- */
let L = null;                                   // estado de la liquidación abierta
const efRep = t => t.cierre ? +t.cierre.efectivo_confirmado_q : t.r.esperado;

async function abrirLiquidacion(){
  if(S.rol === 'supervisor'){ toast('El supervisor no liquida: usa “Recibir efectivo del vendedor de tienda”.', 'warn'); return; }
  if(!navigator.onLine){
    modal(`<div class="mh"><h2>Liquidar mi día</h2><button class="btn mini sec" onclick="cerrarModal()">✕</button></div>
      <p class="aviso">Para liquidar necesitas internet, porque el sistema suma todo lo registrado en el servidor.<br>Sigue vendiendo: cuando vuelva la señal, se sincroniza y podrás liquidar.</p>`);
    return;
  }
  // Antes de liquidar, todo lo guardado en el teléfono debe estar enviado
  if(ls.get('cola', []).length){ await sincronizar(); }
  if(ls.get('cola', []).length){ toast('Aún hay registros sin enviar. Espera a que se sincronicen y vuelve a intentar.', 'warn'); return; }
  modal('<p class="cargando">Calculando tu día…</p>');
  try{
    const f = hoy(), me = S.user.id;
    const [r, cierre] = await Promise.all([resumenDia(f, me), cierreDe(f, me)]);
    let reps = [];
    if(S.rol === 'tienda') reps = await Promise.all(S.usuarios.filter(u => u.rol === 'repartidor' && u.activo).map(u => datosRepartidor(u, f)));
    L = {f, r, cierre, reps};
    pintarLiq();
  }catch(e){ cerrarModal(); toast(errMsg(e), 'err'); }
}

function pintarLiq(){
  const {f, r, cierre, reps} = L, esTienda = S.rol === 'tienda';
  const sinLiq = reps.filter(t => !t.cierre);
  const sumaReps = r2(reps.reduce((a,t) => a + efRep(t), 0));
  const cabecera = `<div class="mh"><h2>Liquidar mi día · ${fmtFecha(f)}</h2><button class="btn mini sec" onclick="cerrarModal()">✕ Cerrar</button></div>`;
  const kpis = `<div class="grid">
      <div class="kpi"><small>Ventas del día</small><b>${Q(r.total)}</b></div>
      <div class="kpi"><small>💵 Efectivo cobrado</small><b>${Q(r.ef)}</b></div>
      <div class="kpi"><small>🏦 Transferencias</small><b>${Q(r.tr)}</b></div>
      <div class="kpi"><small>📒 Créditos</small><b>${Q(r.cr)}</b></div>
      <div class="kpi"><small>💸 Gastos pagados</small><b>${Q(r.gastos)}</b></div>
      <div class="kpi" style="background:var(--agua)"><small>Efectivo esperado</small><b>${Q(r.esperado)}</b></div></div>
    <p class="peq">Efectivo esperado = efectivo cobrado − gastos pagados con ese efectivo. Transferencias y créditos no se entregan en efectivo.</p>`;
  const bloqueReps = esTienda ? `
    <h3 style="margin-top:14px">Liquidaciones de repartidores (solo lectura)</h3>
    ${reps.length ? `<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Repartidor</th><th class="n">Esperado</th><th class="n">Entregó</th><th class="n">Dif.</th><th>Estado</th></tr></thead><tbody>
      ${reps.map(t => `<tr><td>${esc(t.u.nombre)}</td><td class="n">${Q(t.r.esperado)}</td><td class="n">${t.cierre ? Q(t.cierre.efectivo_confirmado_q) : '—'}</td>
        <td class="n ${t.cierre && +t.cierre.diferencia_q<0?'neg':''}">${t.cierre ? Q(t.cierre.diferencia_q) : '—'}</td>
        <td>${t.cierre ? '<span class="badge ok">Liquidó</span>' : '<span class="badge mal">Pendiente</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="peq">No hay repartidores activos.</p>'}
    ${sinLiq.length ? `<p class="aviso">⚠ Falta que liquiden: <b>${sinLiq.map(t => esc(t.u.nombre)).join(', ')}</b>. Mientras tanto se usa su efectivo <i>esperado</i> en el consolidado.</p>` : ''}` : '';

  if(cierre){          // ---- ya liquidado: solo lectura ----
    const dif = +cierre.diferencia_q;
    const cons = esTienda ? +(cierre.efectivo_consolidado_q ?? (+cierre.efectivo_confirmado_q + sumaReps)) : null;
    modal(`${cabecera}<div class="aviso" style="background:#e6f6ed;border-color:var(--verde)">✅ Este día ya está liquidado (${new Date(cierre.cerrado_en).toLocaleTimeString('es-GT',{timeZone:ZONA,hour:'2-digit',minute:'2-digit'})}).
        ${cierre.estado === 'conciliado' ? '<br><b>El supervisor ya recibió el efectivo.</b>' : ''}</div>
      ${kpis}
      <div class="card" style="margin-top:10px"><b>Efectivo que entregaste:</b> ${Q(cierre.efectivo_confirmado_q)} ·
        diferencia <b class="${dif<0?'neg':dif>0?'pos':''}">${Q(dif)}</b>${cierre.notas ? `<br><small>Nota: ${esc(cierre.notas)}</small>` : ''}</div>
      ${bloqueReps}

      </div>

    </div>
    <button class="btn grande verde" id="lq-ok" disabled onclick="guardarLiquidacion()">✔ Confirmar liquidación</button>`, 'liq');
}
function liqCalc(){
  const {r, reps} = L, raw = $('#lq-conf').value.trim(), esTienda = S.rol === 'tienda';
  const box = $('#lq-nota-caja'), out = $('#lq-dif'), btn = $('#lq-ok');
  if(raw === ''){ out.textContent = 'Escribe el monto para ver la diferencia.'; box.hidden = true; btn.disabled = true; if(esTienda) $('#lq-cons').textContent = ''; return; }
  const conf = num(raw), dif = r2(conf - r.esperado);
  out.innerHTML = dif === 0 ? '<b class="pos">✔ Coincide con lo esperado.</b>'
    : `<b class="${dif<0?'neg':'pos'}">Diferencia: ${Q(dif)} (${dif<0?'faltante':'sobrante'})</b> · esperado ${Q(r.esperado)}`;
  box.hidden = dif === 0;
  btn.disabled = conf < 0 || (dif !== 0 && $('#lq-nota').value.trim().length < 5);
  if(esTienda) $('#lq-cons').textContent = Q(r2(conf + reps.reduce((a,t) => a + efRep(t), 0)));
}
async function guardarLiquidacion(){
  const {f, r, reps} = L, esTienda = S.rol === 'tienda';
  const conf = num($('#lq-conf').value), dif = r2(conf - r.esperado), nota = ($('#lq-nota').value || '').trim();
  if(dif !== 0 && nota.length < 5) return toast('Escribe la justificación de la diferencia', 'warn');
  if(!confirm(`Vas a cerrar tu día entregando ${Q(conf)} en efectivo.\n${dif !== 0 ? `Diferencia: ${Q(dif)}\n` : ''}Después solo el supervisor podrá corregirlo. ¿Confirmar?`)) return;
  const btn = $('#lq-ok'); btn.disabled = true;
  const fila = {fecha:f, usuario_id:S.user.id, rol:S.rol, total_ventas_q:r.total, efectivo_esperado_q:r.esperado, efectivo_confirmado_q:r2(conf),
    transferencia_q:r.tr, credito_q:r.cr, total_egresos_q:r.gastos, diferencia_q:dif, notas:nota || null, estado:'cerrado'};
  if(esTienda) fila.efectivo_consolidado_q = r2(conf + reps.reduce((a,t) => a + efRep(t), 0));
  const {error} = await sb.from('cierres_diarios').insert(fila);
  if(error){
    btn.disabled = false;
    return toast(error.code === '23505' ? 'Este día ya fue liquidado.' : errMsg(error), 'err');
  }
  toast('Día liquidado ✔');
  L.cierre = {...fila, cerrado_en:new Date().toISOString()}; pintarLiq();
  if(S.vista === 'inicio') ir('inicio');
}

async function abrirRecepcion(fecha){

    let cierres = [];
    if(ids.length){
      const {data, error} = await sb.from('cierres_diarios').select('*').eq('fecha', f).in('usuario_id', ids);
      if(error) throw error; cierres = data;
    }
    S.recep = cierres;
    modal(`<div class="mh"><h2>💰 Recibir efectivo de tienda</h2><button class="btn mini sec" onclick="cerrarModal()">✕ Cerrar</button></div>
      <label for="rc-f">Fecha del cierre</label><input type="date" id="rc-f" value="${f}" max="${hoy()}" onchange="abrirRecepcion(this.value)">
      ${!ids.length ? '<p class="aviso">No hay usuarios con rol tienda. Créalos en “Usuarios”.</p>' : ''}
      ${ids.length && !cierres.length ? '<p class="aviso">El vendedor de tienda todavía no ha liquidado ese día.</p>' : ''}
      ${cierres.map(c => {

        if(c.estado === 'conciliado'){
          const d = r2(+c.monto_recibido_q - esp);
          return `<div class="card dest"><div class="mh"><h3 style="margin:0">${esc(nombreUsuario(c.usuario_id))}</h3><span class="badge ok">Conciliado</span></div>
            <p>Debía entregar <b>${Q(esp)}</b> · recibiste <b>${Q(c.monto_recibido_q)}</b> · diferencia <b class="${d<0?'neg':d>0?'pos':''}">${Q(d)}</b></p>
            ${c.notas ? `<small>${esc(c.notas)}</small>` : ''}</div>`;
        }
        return `<div class="card dest"><div class="mh"><h3 style="margin:0">${esc(nombreUsuario(c.usuario_id))}</h3><span class="badge amb">Por recibir</span></div>
          <p>Total consolidado que debe entregarte (su efectivo + repartidores): <b style="font-size:1.3rem">${Q(esp)}</b></p>
          <label>Monto que recibes ahora (Q)</label>
          <input id="rc-m-${c.id}" inputmode="decimal" placeholder="Cuenta el dinero y escribe el total" oninput="recCalc('${c.id}')">
          <div id="rc-d-${c.id}" class="peq" style="margin-top:6px"></div>
          <div id="rc-nb-${c.id}" hidden><label style="color:var(--rojo)">Justificación de la diferencia (obligatoria)</label><textarea id="rc-n-${c.id}" oninput="recCalc('${c.id}')"></textarea></div>
          <button class="btn grande verde" id="rc-b-${c.id}" disabled style="margin-top:8px" onclick="guardarRecepcion('${c.id}')">✔ Registrar recepción y conciliar</button></div>`;
      }).join('')}`);
  }catch(e){ cerrarModal(); toast(errMsg(e), 'err'); }
}
function recCalc(id){
  const c = S.recep.find(x => x.id === id), esp = +(c.efectivo_consolidado_q ?? c.efectivo_confirmado_q);
  const raw = $('#rc-m-'+id).value.trim(), btn = $('#rc-b-'+id);
  if(raw === ''){ $('#rc-d-'+id).textContent = ''; $('#rc-nb-'+id).hidden = true; btn.disabled = true; return; }
  const d = r2(num(raw) - esp);
  $('#rc-d-'+id).innerHTML = d === 0 ? '<b class="pos">✔ Coincide.</b>' : `<b class="${d<0?'neg':'pos'}">Diferencia: ${Q(d)}</b>`;
  $('#rc-nb-'+id).hidden = d === 0;
  btn.disabled = d !== 0 && $('#rc-n-'+id).value.trim().length < 5;
}
async function guardarRecepcion(id){
  const c = S.recep.find(x => x.id === id), esp = +(c.efectivo_consolidado_q ?? c.efectivo_confirmado_q);
  const monto = num($('#rc-m-'+id).value), d = r2(monto - esp), nota = ($('#rc-n-'+id).value || '').trim();
  if(d !== 0 && nota.length < 5) return toast('Escribe la justificación', 'warn');
  if(!confirm(`Registrar que recibiste ${Q(monto)}${d !== 0 ? ` (diferencia ${Q(d)})` : ''}?`)) return;
  const notas = [c.notas, d !== 0 ? `Recepción supervisor: ${nota}` : null].filter(Boolean).join(' | ') || null;
  const {error} = await sb.from('cierres_diarios').update({estado:'conciliado', monto_recibido_q:r2(monto), conciliado_en:new Date().toISOString(), conciliado_por:S.user.id, notas}).eq('id', id);
  if(error) return toast(errMsg(error), 'err');
  toast('Efectivo recibido y día conciliado ✔'); abrirRecepcion($('#rc-f').value); if(S.vista === 'inicio') ir('inicio');
}

/* ---------------------------------------------------------------------
   ESTADO DE RESULTADOS  (solo supervisor)
   Quincena 1 = día 1–15 · Quincena 2 = día 16–fin de mes · Mes completo.
   Ingresos = ventas tienda + ventas domicilio + otros ingresos (manual)
   Costo de ventas = egresos de categorías marcadas "costo de venta"
                     (producción de agua, hielo, insumos de producción)
   Gastos fijos = sueldos, alquiler, agua/luz, internet
   Gastos variables = gasolina, mantenimiento, insumos, compras, otros
   Utilidad bruta = ingresos − costo de ventas
   Utilidad neta  = utilidad bruta − gastos fijos − gastos variables
   Se compara contra el mismo período de los 2 años anteriores.
   --------------------------------------------------------------------- */
const p2d = n => String(n).padStart(2, '0');
const finMes = (a, m) => new Date(a, m, 0).getDate();
function rangoER(anio, mes, per){
  const fin = finMes(anio, mes), [a, b] = per === 'q1' ? [1, 15] : per === 'q2' ? [16, fin] : [1, fin];
  return {desde:`${anio}-${p2d(mes)}-${p2d(a)}`, hasta:`${anio}-${p2d(mes)}-${p2d(b)}`};
}
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const nomPer = {q1:'1ª quincena (1–15)', q2:'2ª quincena (16–fin)', mes:'Mes completo'};
function armarER(c, otros){
  const vt = +c.ventas_tienda, vd = +c.ventas_domicilio, ing = r2(vt + vd + otros), cv = +c.costo_ventas;
  const fj = +c.gastos_fijos, gv = +c.gastos_variables, bruta = r2(ing - cv), neta = r2(bruta - fj - gv);
  return {vt, vd, otros, ing, cv, bruta, fj, gv, neta, margen: ing ? r2(neta / ing * 100) : 0};
}

VISTAS.er = async () => {
  const h = hoy();
  const E = S.erSel = S.erSel || {anio:+h.slice(0,4), mes:+h.slice(5,7), per:(+h.slice(8,10) <= 15 ? 'q1' : 'q2')};
  const cols = [0, 1, 2].map(i => ({anio:E.anio - i, ...rangoER(E.anio - i, E.mes, E.per)}));
  const [calc, guardados, gastos, costos] = await Promise.all([
    Promise.all(cols.map(c => rpc('calc_er', {p_desde:c.desde, p_hasta:c.hasta}))),
    sb.from('estado_resultados').select('*').order('fecha_inicio', {ascending:false}).limit(24).then(okR),
    rpc('rpt_gastos', {p_desde:cols[0].desde, p_hasta:cols[0].hasta}),
    rpc('rpt_costo_productos', {p_desde:cols[0].desde, p_hasta:cols[0].hasta}).catch(() => [])
  ]);
  const periodo = E.per === 'mes' ? 'mes' : 'quincena';
  cols.forEach((c, i) => {
    c.calc = calc[i][0] || {ventas_tienda:0, ventas_domicilio:0, costo_ventas:0, gastos_fijos:0, gastos_variables:0};
    c.saved = guardados.find(g => g.periodo === periodo && g.fecha_inicio === c.desde && g.fecha_fin === c.hasta) || null;
    c.otros = c.saved ? +c.saved.otros_ingresos_q : 0;
  });
  S.erData = {E, cols, guardados, gastos, costos, periodo};
  pintarER();
};

      <p class="peq">${fmtFecha(cols[0].desde)} al ${fmtFecha(cols[0].hasta)} · Comparado con el mismo período de ${anios[1]} y ${anios[2]}.</p>

const varPct = (a, b) => { if(!b) return a ? '<small>nuevo</small>' : '—'; const p = (a - b) / Math.abs(b) * 100; return `<span class="${p<0?'neg':'pos'}">${p>0?'+':''}${p.toFixed(0)} %</span>`; };
function cambiarER(){
  S.erSel = {anio:Math.min(2100, Math.max(2015, +$('#er-anio').value || +hoy().slice(0,4))), mes:+$('#er-mes').value, per:$('#er-per').value};

}
function abrirER(id){

async function guardarER(){

async function guardarGasto(){
  const monto = num($('#g-monto').value), desc = $('#g-desc').value.trim();

  const btn = $('#g-ok'); btn.disabled = true;
  try{
    const r = await enviar({k:'egreso', egreso:{id:uuid(), fecha:f, usuario_id:S.user.id, categoria_id:cat, subcategoria:null, monto_q:r2(monto), descripcion:desc || null}});
    toast(r.cola ? 'Gasto guardado sin conexión ⏳' : 'Gasto guardado ✔'); ir('gastos');
  }catch(e){ toast(errMsg(e), 'err'); btn.disabled = false; }
}
async function borrarGasto(id){
  if(!confirm('¿Borrar este gasto? No se puede deshacer.')) return;
  const {error} = await sb.from('egresos').delete().eq('id', id);
  if(error) return toast(errMsg(error), 'err'); toast('Gasto borrado'); ir('gastos');
}

// Cuánto ha vendido cada repartidor hoy a domicilio, por producto (para saber qué le queda de su carga)
async function ventaDetalleHoyPorUsuario(f){
  const ventas = await sb.from('ventas').select('id,usuario_id').eq('fecha', f).eq('tipo','domicilio').then(okR);
  if(!ventas.length) return {};
  const idxUser = {}; ventas.forEach(v => idxUser[v.id] = v.usuario_id);
  const det = await paginar(() => sb.from('venta_detalle').select('venta_id,producto_id,cantidad').in('venta_id', ventas.map(v => v.id)));
  const out = {};
  det.forEach(d => { const rep = idxUser[d.venta_id]; if(!rep) return; (out[rep] ||= {})[d.producto_id] = (out[rep][d.producto_id] || 0) + +d.cantidad; });
  return out;
}
// Ventas del propio repartidor guardadas en el teléfono, aún sin enviar (para que su "disponible" no se atrase sin señal)
function ventasEnColaHoy(uid, f){
  const out = {};
  ls.get('cola', []).forEach(op => {
    if(op.k === 'venta' && op.venta.usuario_id === uid && op.venta.fecha === f && op.venta.tipo === 'domicilio'){
      (op.detalle || []).forEach(d => out[d.producto_id] = (out[d.producto_id] || 0) + +d.cantidad);
    }
  });
  return out;
}

      ${filasResumen.length ? `<h3 style="margin-top:16px">Lo que le queda a cada quien <small>(cargado − vendido hoy)</small></h3>
        <p class="peq">Se actualiza cada vez que abres esta pantalla; no es en vivo, porque este sistema no usa conexión permanente (funciona sin señal). Las ventas guardadas en el teléfono de un repartidor sin conexión aparecen aquí solo cuando se sincronizan.</p>
        <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Repartidor</th><th>Producto</th><th class="n">Cargado</th><th class="n">Vendido</th><th class="n">Disponible</th></tr></thead><tbody>
        ${filasResumen.map(x => `<tr><td>${esc(x.rep.nombre)}</td><td>${ICONO_CAT[(S.productos.find(p=>p.id===x.pid)||{}).categoria] || ''} ${esc(nomProd(x.pid))}</td><td class="n">${x.c}</td><td class="n">${x.v}</td><td class="n ${x.disp<0?'neg':''}">${x.disp}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
      ${cargasHoy.length ? `<details class="ayuda" style="margin-top:12px"><summary>Historial de cargas de hoy (${cargasHoy.length}) · corregir una equivocación</summary>
        <div class="tabla-wrap"><table class="tabla"><thead><tr><th>Hora</th><th>Repartidor</th><th>Producto</th><th class="n">Cantidad</th><th>Quién cargó</th><th class="no-print"></th></tr></thead><tbody>
        ${cargasHoy.slice().sort((a,b) => b.created_at.localeCompare(a.created_at)).map(c => `<tr><td>${new Date(c.created_at).toLocaleTimeString('es-GT',{timeZone:ZONA,hour:'2-digit',minute:'2-digit'})}</td>

          <td class="no-print"><button class="btn mini rojo" onclick="borrarCarga('${c.id}')" aria-label="Borrar">🗑</button></td></tr>`).join('')}
        </tbody></table></div>
        <p class="peq">Si cargaste una cantidad equivocada, bórrala aquí y vuelve a registrarla arriba.</p></details>` : ''}
    </div>
    <div class="dos">
    <div class="card"><h2>🏭 Registrar producción</h2>
      <label>Fecha</label><input type="date" id="pr-f" value="${hoy()}" max="${hoy()}">
      <label>Garrafones llenados</label>

async function guardarProduccion(){
  const marca = Math.round(num($('#pr-gm').value)), generico = Math.round(num($('#pr-gg').value)), bolsas = Math.round(num($('#pr-b').value));

  const ins = {}; [1,2,3].forEach(i => { const n = $('#pr-in'+i).value.trim(), q = num($('#pr-iq'+i).value); if(n) ins[n] = q; });
  const {error} = await sb.from('produccion').insert({fecha:$('#pr-f').value || hoy(), garrafones_marca:marca, garrafones_generico:generico, bolsas_producidas:bolsas, insumos_usados:ins, usuario_id:S.user.id});
  if(error) return toast(errMsg(error), 'err'); toast('Producción guardada ✔'); ir('prod');

async function guardarInvMov(){
  const tipo = $('#iv-t').value, cant = num($('#iv-c').value);

  const {error} = await sb.from('inventario_mov').insert({fecha:hoy(), producto_id:$('#iv-p').value, tipo, cantidad:cant, motivo:$('#iv-m').value.trim() || null, usuario_id:S.user.id});
  if(error) return toast(errMsg(error), 'err'); toast('Movimiento guardado ✔'); ir('prod');
}
function pintarCarga(){
  const box = $('#cr-prods'); if(!box) return;
  const lista = S.productos.filter(p => p.activo), yaCargado = CR.porRep[CR.rep] || {};
  box.innerHTML = `<div class="prods">` + lista.map(p => {
    const q = CR.cart[p.id] || 0, ico = ICONO_CAT[p.categoria] || ICONO_CAT.otro, ya = yaCargado[p.id] || 0;
    return `<div class="prod ${q?'on':''}" data-cat="${p.categoria}"><div class="pn"><b><span class="cat-ico">${ico}</span>${esc(p.nombre)}</b>${ya ? `<small>Ya tiene ${ya} hoy</small>` : ''}</div>
      <div class="stp"><button onclick="crMas('${p.id}',-1)" aria-label="Quitar">−</button><span>${q}</span><button onclick="crMas('${p.id}',1)" aria-label="Sumar">＋</button></div></div>`;
  }).join('') + `</div>`;
}
function crMas(pid, d){ CR.cart[pid] = Math.max(0, (CR.cart[pid] || 0) + d); pintarCarga(); }
async function guardarCarga(){
  if(!CR.rep) return toast('Elige un repartidor', 'warn');
